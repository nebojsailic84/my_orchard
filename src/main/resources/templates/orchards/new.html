<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{orchard.new.title}">Vocnjak — New Orchard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/langswitch :: langswitch}"></div>

<h1 th:text="#{orchard.new.heading}">New orchard</h1>

<div class="card">
    <form th:action="@{/orchards}" th:object="${orchardCreateForm}" method="post">
        <div class="field">
            <label for="name" th:text="#{orchard.new.name}">Name</label>
            <input type="text" id="name" th:field="*{name}"/>
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="field">
            <label for="rows" th:text="#{orchard.new.rows}">Rows</label>
            <input type="number" id="rows" th:field="*{rows}" min="1" max="100"/>
            <span class="error" th:if="${#fields.hasErrors('rows')}" th:errors="*{rows}"></span>
        </div>
        <div class="field">
            <label for="columns" th:text="#{orchard.new.columns}">Columns</label>
            <input type="number" id="columns" th:field="*{columns}" min="1" max="100"/>
            <span class="error" th:if="${#fields.hasErrors('columns')}" th:errors="*{columns}"></span>
        </div>
        <div class="field">
            <label for="orientationNote" th:text="#{orchard.new.orientationNote}">Orientation note (optional)</label>
            <textarea id="orientationNote" th:field="*{orientationNote}"
                      th:placeholder="#{orchard.new.orientationNotePlaceholder}"></textarea>
            <span class="error" th:if="${#fields.hasErrors('orientationNote')}" th:errors="*{orientationNote}"></span>
        </div>
        <button class="btn" type="submit" th:text="#{common.create}">Create</button>
    </form>
</div>

<p><a class="back-link" th:href="@{/orchards}" th:text="#{common.backToOrchards}">&larr; Back to orchards</a></p>
</body>
</html>
